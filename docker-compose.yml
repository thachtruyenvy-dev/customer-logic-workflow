services:
  emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
      args:
        EMULATOR_ARCH: ${EMULATOR_ARCH:-x86_64}
    image: aws-emulator
    container_name: clw-aws-emulator
    command: ["-p", "9297"]
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "127.0.0.1:9297:9297"
    environment:
      EMULATOR_TELEMETRY: "off"
    volumes:
      - ${USERPROFILE:-${HOME}}/.aws/emulator:/home/emulator/.aws/emulator
